# $recency_* tokens are used by herdr-space-recency.
[ui.sidebar.spaces]
rows = [
  [
    "state_icon",
    "$recency_fresh",
    { token = "$recency_faded", fg = "#A0A0A0" },
    { token = "$recency_stale", fg = "#606060" },
  ],
  [
    "$recency_branch_fresh",
    { token = "$recency_branch_faded", fg = "#A0A0A0" },
    { token = "$recency_branch_stale", fg = "#606060" },
    "git_status",
  ],
]
